name: Manyue v9 final ARM64 build

on:
  push:
    branches:
      - codex/manyue-v9-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manyue-v9-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Verify assets, test and build ARM64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract v9 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q ManyueNext-v9-source.zip -d project
          test -s project/gradlew
          chmod +x project/gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Add Real-CUGAN and Anime4K native assets
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/realsr-assets"
          mkdir -p "$work"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$work/assets.zip" \
            https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip
          unzip -q "$work/assets.zip" -d "$work/unpacked"

          find_one() {
            local label="$1"
            shift
            local found=""
            for pattern in "$@"; do
              found="$(find "$work/unpacked" -type f -iname "$pattern" -print -quit)"
              if [[ -n "$found" ]]; then
                printf '%s\n' "$found"
                return 0
              fi
            done
            echo "Missing asset: $label" >&2
            exit 1
          }

          find_path() {
            local label="$1"
            local path_pattern="$2"
            local found
            found="$(find "$work/unpacked" -type f -path "$path_pattern" -print -quit)"
            if [[ -z "$found" ]]; then
              echo "Missing asset: $label ($path_pattern)" >&2
              exit 1
            fi
            printf '%s\n' "$found"
          }

          native="project/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$native"
          cp "$(find_one 'Real-CUGAN runner' 'realcugan-ncnn' '*realcugan*ncnn*')" \
            "$native/libmanyue_realcugan.so"
          cp "$(find_one 'Anime4K runner' 'Anime4KCPP' 'anime4kcpp' 'Anime4KCPP*' 'anime4kcpp*')" \
            "$native/libmanyue_anime4k.so"
          cp "$(find_one 'OpenMP runtime' 'libomp.so')" "$native/libomp.so"

          model_dir="project/app/src/main/assets/ai/models-Real-CUGAN-se"
          mkdir -p "$model_dir"
          cp "$(find_path 'Real-CUGAN model' '*/models-se/up2x-no-denoise.bin')" \
            "$model_dir/up2x-no-denoise.bin"
          cp "$(find_path 'Real-CUGAN params' '*/models-se/up2x-no-denoise.param')" \
            "$model_dir/up2x-no-denoise.param"
          chmod 755 "$native/libmanyue_realcugan.so" "$native/libmanyue_anime4k.so"

      - name: Verify native files and model hashes
        working-directory: project
        run: python3 scripts/verify_manyue_native.py

      - name: Run Manyue unit tests
        working-directory: project
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'eu.kanade.tachiyomi.ui.reader.manyue.*'

      - name: Assemble release APKs
        working-directory: project
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify ARM64 APK and package delivery
        shell: bash
        run: |
          set -euo pipefail
          apk="project/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -q 'lib/arm64-v8a/libmanyue_realcugan.so' "$RUNNER_TEMP/apk-files.txt"
          grep -q 'lib/arm64-v8a/libmanyue_anime4k.so' "$RUNNER_TEMP/apk-files.txt"
          grep -q 'models-Real-CUGAN-se/up2x-no-denoise.bin' "$RUNNER_TEMP/apk-files.txt"

          cat > project/MANYUE_V9_STATUS.md <<EOF
          # Manyue v9 build verification

          - GitHub Actions run: ${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Native assets: SHA-256 and ARM64 ELF verification passed.
          - Manyue JVM unit tests: passed.
          - ARM64 release APK: assembled and APK signature verification passed.
          - APK contents: Real-CUGAN runner/model and Anime4K runner present.
          - Device verification: pending on Honor Magic V2; Vulkan behavior, live page replacement frame drops, five-page prefetch timing, memory/thermal behavior and fold-state preservation are not claimed as device-tested.
          EOF

          mkdir -p "${RUNNER_TEMP}/manyue-v9-delivery"
          cp "$apk" "${RUNNER_TEMP}/manyue-v9-delivery/ManyueNext-v9-arm64-release.apk"
          (
            cd project
            zip -qr "${RUNNER_TEMP}/manyue-v9-delivery/ManyueNext-v9-source.zip" . \
              -x '.gradle/*' '*/build/*' 'build/*' '.kotlin/*'
          )
          sha256sum "${RUNNER_TEMP}/manyue-v9-delivery/ManyueNext-v9-arm64-release.apk" \
            "${RUNNER_TEMP}/manyue-v9-delivery/ManyueNext-v9-source.zip" \
            > "${RUNNER_TEMP}/manyue-v9-delivery/SHA256SUMS.txt"
          cat > "${RUNNER_TEMP}/manyue-v9-delivery/BUILD_VERIFICATION.txt" <<EOF
          Manyue v9 final build
          Workflow run: ${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}
          Unit tests: passed
          Native/model integrity: passed
          ARM64 Release APK signature: passed
          Device testing on Honor Magic V2: not performed by CI
          EOF

      - name: Upload APK, source and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manyue-fixed2x-v9-final-${{ github.run_number }}
          if-no-files-found: error
          path: ${{ runner.temp }}/manyue-v9-delivery/*
